<footer class="footer">
  <div class="footer__left">
    {{ partial "sparkle.html" (dict "size" 12 "class" "is-red") }}
    <span>© {{ now.Year }} Cindy Ha · built with Hugo</span>
  </div>
  <div class="footer__links">
    <a href="mailto:{{ site.Params.email }}" data-track="contact_click" data-track-method="email">email</a>
    {{- range site.Params.socials }}
    <a href="{{ .url }}" target="_blank" rel="noopener" data-track="contact_click" data-track-method="{{ .name | lower }}">{{ .name | lower }}</a>
    {{- end }}
    <span class="footer__hint">press <kbd>/</kbd> for terminal</span>
  </div>
</footer>
