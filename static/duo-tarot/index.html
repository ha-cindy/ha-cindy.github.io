efore midnight is not a study schedule. it's a hostage situation.`},{id:`major-3`,arcana:`major`,suit:null,rank:`III`,traditional:`The Empress`,name:`The Daily Goal`,label:`III · The Empress`,artSubject:`Bea`,theme:`discipline`,weights:{z:.8,d:1,w:1.2,m:1.3,y:1.3},meaning:`growth that comes from small, steady care. five minutes a day turns into something big.`,adviceGentle:`you don't need a perfect day. you need a day.`,adviceRoast:`you set your goal to casual and still miss it sometimes. bold.`},{id:`major-4`,arcana:`major`,suit:null,rank:`IV`,traditional:`The Emperor`,name:`The Leaderboard`,label:`IV · The Emperor`,artSubject:`Oscar`,theme:`win`,weights:{z:.6,d:.8,w:1.2,m:1.5,y:1.8},meaning:`authority and structure. also a deeply personal rivalry with a stranger in your league.`,adviceGentle:`competition looks good on you. keep climbing.`,adviceRoast:`you lost the top spot by 12 XP and you still think about it. we know.`},{id:`major-5`,arcana:`major`,suit:null,rank:`V`,traditional:`The Hierophant`,name:`The High School Teacher`,label:`V · The Hierophant`,artSubject:`Oscar`,theme:`discipline`,weights:{z:.8,d:1,w:1.2,m:1.3,y:1.3},meaning:`tradition and rules. the way you were taught, for better or worse.`,adviceGentle:`the basics they drilled into you still help. build on them.`,adviceRoast:`you can conjugate "to be" and absolutely nothing else. classic.`},{id:`major-6`,arcana:`major`,suit:null,rank:`VI`,traditional:`The Lovers`,name:`The Lovers`,label:`VI · The Lovers`,artSubject:`Lin`,theme:`love`,weights:{z:1,d:1,w:1,m:1,y:1},meaning:`a choice of the heart. two languages, one tongue, zero idea which one to dream in.`,adviceGentle:`something you love is calling you back. answer it.`,adviceRoast:`you said you were learning for someone special. that someone has not texted back.`},{id:`major-7`,arcana:`major`,suit:null,rank:`VII`,traditional:`The Chariot`,name:`The XP Boost`,label:`VII · The Chariot`,artSubject:`Eddy`,theme:`win`,weights:{z:.6,d:.8,w:1.2,m:1.5,y:1.8} e well beats five half done.`,adviceRoast:`you are not learning five things. you are opening five courses.`},{id:`flames-11`,arcana:`minor`,suit:`flames`,rank:`Beginner`,traditional:`Page of Wands`,name:`The Beginner of Flames`,label:`Beginner of Flames`,artSubject:`Eddy`,theme:`start`,weights:{z:2,d:1.5,w:1,m:.6,y:.4},meaning:`curiosity with zero chill. you want to try everything.`,adviceGentle:`follow the curiosity. it knows where it's going.`,adviceRoast:`you've downloaded the app for the third time this year. hi again.`},{id:`flames-12`,arcana:`minor`,suit:`flames`,rank:`Challenger`,traditional:`Knight of Wands`,name:`The Challenger of Flames`,label:`Challenger of Flames`,artSubject:`Eddy`,theme:`start`,weights:{z:2,d:1.5,w:1,m:.6,y:.4},meaning:`fearless action. you're booking the flight before you can order a coffee.`,adviceGentle:`brave is good. pair it with a daily lesson.`,adviceRoast:`you booked the trip. you have three weeks. the owl is concerned.`},{id:`flames-13`,arcana:`minor`,suit:`flames`,rank:`Queen`,traditional:`Queen of Wands`,name:`The Queen of Flames`,label:`Queen of Flames`,artSubject:`Eddy`,theme:`win`,weights:{z:.6,d:.8,w:1.2,m:1.5,y:1.8},meaning:`confident and warm. you practice out loud and you don't care who hears.`,adviceGentle:`that confidence is how people actually learn.`,adviceRoast:`you narrate your grocery run in Spanish. your roommate has questions.`},{id:`flames-14`,arcana:`minor`,suit:`flames`,rank:`King`,traditional:`King of Wands`,name:`The King of Flames`,label:`King of Flames`,artSubject:`Eddy`,theme:`win`,weights:{z:.6,d:.8,w:1.2,m:1.5,y:1.8},meaning:`vision and leadership. you got the whole group chat learning.`,adviceGentle:`people follow your lead. keep setting it.`,adviceRoast:`you started a friends quest and now everyone resents you.`},{id:`hearts-1`,arcana:`minor`,suit:`hearts`,rank:`Ace`,traditional:`Ace of Cups`,name:`The Full Hearts`,label:`Ace of Hearts`,artSubject:`Lily`,theme:`start`,weights:{z:2,d:1.5,w:1,m:.6,y:.4},meaning:`new feelings. a fresh lesson, all your hearts, no mistakes yet.`,adviceGentle:`you're allowed to be excited about this.`,adviceRoast:`enjoy those hearts. they won't last.`},{id:`hearts-2`,arcana:`minor`,suit:`hearts`,rank:`Two`,traditional:`Two of Cups`,name:`The Study Buddy`,label:`Two of Hearts`,artSubject:`Lily`,theme:`love`,weights:{z:1,d:1,w:1,m:1,y:1},meaning:`partnership. two people, one goal, mutual peer pressure.`,adviceGentle:`find your person. learning together sticks.`,adviceRoast:`your study buddy is your mom. she's ahead of you.`},{id:`hearts-3`,arcana:`minor`,suit:`hearts`,rank:`Three`,traditional:`Three of Cups`,name:`The Friends Quest`,label:`Three of Hearts`,artSubject:`Lily`,theme:`love`,weights:{z:1,d:1,w:1,m:1,y:1},meaning:`friendship and joy. a group chat that actually does the thing.`,adviceGentle:`share the win. it gets bigger.`,adviceRoast:`the friends quest is 80% done. it's all one friend.`},{id:`hearts-4`,arcana:`minor`,suit:`hearts`,rank:`Four`,traditional:`Four of Cups`,name:`The Ignored Notification`,label:`Four of Hearts`,artSubject:`Lily`,theme:`rest`,weights:{z:1,d:1,w:1,m:1,y:1},meaning:`apathy. a reminder arrives and you just look at it.`,adviceGentle:`a little restlessness means you're ready for something new. try a new unit.`,adviceRoast:`you read the notification. you put the phone down. the owl saw.`},{id:`hearts-5`,arcana:`minor`,suit:`hearts`,rank:`Five`,traditional:`Five of Cups`,name:`The Lost Hearts`,label:`Five of Hearts`,artSubject:`Lily`,theme:`change`,weights:{z:1.6,d:1.2,w:.9,m:.8,y:.7},meaning:`a setback. you lost every heart on a lesson about fruit.`,adviceGentle:`it stings, but now you know what tripped you. that's the point.`,adviceRoast:`it was the fruit lesson. it was not that hard.`},{id:`hearts-6`,arcana:`minor`,suit:`hearts`,rank:`Six`,traditional:`Six of Cups`,name:`The Throwback`,label:`Six of Hearts`,artSubject:`Lily`,theme:`love`,weights:{z:1,d:1,w:1,m:1,y:1},meaning:`happy memories. remembe
